name: Testes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # o teste cache-versao compara com a base da branch
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instala Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Sobe o site
        run: |
          python3 -m http.server 8766 > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8766/ > /dev/null && break; sleep 0.5; done
      - name: Roda os testes
        env:
          BASE: http://localhost:8766
          # baterias de UX so como fumaca no PR (20 casos cada); a cheia roda de madrugada (bateria-cheia.yml)
          CASOS: 20
        run: node testes/rodar.mjs
      - name: Guarda os prints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prints
          path: testes/resultados/
          retention-days: 7
