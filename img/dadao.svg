<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -14 260 314" role="img" aria-label="O Dadão: um dado de terno, com microfone de lapela e uma ficha de pergunta">
  <defs>
    <linearGradient id="terno" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26303f"/>
      <stop offset="1" stop-color="#161c26"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edf2"/>
    </linearGradient>
  </defs>

  <!-- braco esquerdo (dele), descansando -->
  <path d="M66 176 C44 196 38 232 46 262" fill="none" stroke="#1d2531" stroke-width="26" stroke-linecap="round"/>
  <circle cx="47" cy="266" r="14" fill="#f4f6f8" stroke="#c9cfd8" stroke-width="2"/>

  <!-- terno -->
  <path d="M62 170 Q130 150 198 170 L212 292 Q130 302 48 292 Z" fill="url(#terno)"/>
  <!-- camisa e gola -->
  <path d="M108 160 L130 214 L152 160 Z" fill="#f4f6f8"/>
  <!-- lapelas -->
  <path d="M100 160 L130 232 L112 226 L92 190 L104 180 L90 168 Z" fill="#2f3a4c"/>
  <path d="M160 160 L130 232 L148 226 L168 190 L156 180 L170 168 Z" fill="#2f3a4c"/>
  <!-- gravata borboleta dourada -->
  <path d="M130 170 L112 160 L112 182 Z M130 170 L148 160 L148 182 Z" fill="#f2c230"/>
  <circle cx="130" cy="171" r="5.5" fill="#d9a900"/>
  <!-- botoes -->
  <circle cx="130" cy="252" r="4" fill="#0e131a"/>
  <circle cx="130" cy="272" r="4" fill="#0e131a"/>
  <!-- lenco no bolso, lima da marca -->
  <path d="M168 214 L190 212 L190 220 L168 222 Z" fill="#0e131a"/>
  <path d="M170 214 L175 205 L180 213 L185 204 L189 212 Z" fill="#c8ff00"/>
  <!-- microfone de lapela -->
  <path d="M100 198 C96 222 88 240 76 262" fill="none" stroke="#0e131a" stroke-width="2.5"/>
  <rect x="93" y="182" width="15" height="20" rx="7.5" fill="#5a6474" stroke="#aab2bf" stroke-width="1.5"/>
  <path d="M96 188 H105 M96 192 H105 M96 196 H105" stroke="#aab2bf" stroke-width="1.2"/>
  <rect x="95" y="201" width="11" height="5" rx="1.5" fill="#d0d6de"/>

  <!-- cabeca: o dado, com um pouco de profundidade -->
  <path d="M84 20 L196 20 L212 36 L212 146 L196 160 L84 160 Z" fill="#c9cfd8"/>
  <rect x="64" y="14" width="136" height="140" rx="26" fill="url(#face)" stroke="#c9cfd8" stroke-width="2"/>
  <!-- rosto: dois pontos do dado viram olhos -->
  <circle cx="106" cy="68" r="12" fill="#0e131a"/>
  <circle cx="158" cy="68" r="12" fill="#0e131a"/>
  <circle cx="110" cy="64" r="3.5" fill="#ffffff"/>
  <circle cx="162" cy="64" r="3.5" fill="#ffffff"/>
  <path d="M94 46 Q106 38 118 44" fill="none" stroke="#0e131a" stroke-width="5" stroke-linecap="round"/>
  <path d="M146 44 Q158 36 170 44" fill="none" stroke="#0e131a" stroke-width="5" stroke-linecap="round"/>
  <!-- sorrisao de apresentador -->
  <path d="M100 100 Q132 136 164 100 Q132 114 100 100 Z" fill="#0e131a"/>
  <path d="M110 106 Q132 116 154 106 L152 110 Q132 118 112 110 Z" fill="#ffffff"/>
  <!-- os outros pontos, na lateral -->
  <circle cx="207" cy="60" r="4" fill="#0e131a" opacity="0.55"/>
  <circle cx="207" cy="90" r="4" fill="#0e131a" opacity="0.55"/>
  <circle cx="207" cy="120" r="4" fill="#0e131a" opacity="0.55"/>
  <!-- o telhado da marca, de chapeu -->
  <path d="M86 16 L132 -4 L178 16" fill="none" stroke="#c8ff00" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 6)"/>

  <!-- braco direito (dele) levantado com a ficha da pergunta -->
  <path d="M196 178 C222 170 232 142 228 116" fill="none" stroke="#1d2531" stroke-width="26" stroke-linecap="round"/>
  <g transform="rotate(10 232 92)">
    <rect x="212" y="54" width="44" height="60" rx="6" fill="#f2c230" stroke="#d9a900" stroke-width="2"/>
    <text x="234" y="98" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="800" font-size="42" fill="#111">?</text>
  </g>
  <circle cx="226" cy="112" r="14" fill="#f4f6f8" stroke="#c9cfd8" stroke-width="2"/>
</svg>
